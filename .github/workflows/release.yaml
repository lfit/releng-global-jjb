---
name: Release announcement

# yamllint disable-line rule:truthy
on: push

permissions:
  contents: read # least privilege; the publish job raises what it needs

# A release must not be cancelled part way through publishing, so queue
# runs per tag rather than cancelling one that is already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release notes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create publishes the GitHub release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # reno maps notes to versions by walking the entire branch
          # history. A shallow clone truncates that walk, so fetch
          # everything rather than deepening to a fixed commit count.
          fetch-depth: 0
          persist-credentials: false
      - name: Get tag
        id: tag
        uses: devops-actions/action-get-tag@72a6a37ed663481e5b8f89c6ad4820cd572def8e # v1.0.5
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.8"
      - name: Generate reno report
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # No '|| true' and no discarded stderr: a reno failure has to
          # fail the job. Masking it publishes an empty release body,
          # which is how releases shipped carrying no notes at all.
          pipx run tox -e reno -- report --version "$TAG" > reno-notes.md
          sed '/^\.pkg.*$/d' reno-notes.md |
            sed '/^reno:.*$/d' |
            sed '/^\.\. .*$/d' |
            sed '$d' |
            sed '$d' |
            sed '1d' > modified-reno-notes.md
          # An empty report is legitimate for a release carrying no notes,
          # so warn rather than fail, but make it visible in the log.
          if [ ! -s modified-reno-notes.md ]; then
            echo "::warning::reno produced no release notes for ${TAG}"
          fi
      - name: Create Release Notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --generate-notes -F modified-reno-notes.md
